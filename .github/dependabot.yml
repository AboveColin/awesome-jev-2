# Keeps the actions in .github/workflows current: once a week, one pull request
# for everything that has a new release, which a person reads and merges.
# Nothing merges it automatically. A new major of an action can change what a
# workflow does — upload-pages-artifact v4 began leaving dotfiles out of the
# Pages artifact — so its release notes deserve a reading before it lands.
#
# The workflows reference major tags (actions/checkout@v7), not commit SHAs, so
# a pull request appears only when a new major ships; fixes within a major
# arrive without one. tests/test_workflow_actions.py fails if an action falls
# below its first Node 24 major, or if a new action is added without its
# runtime being looked up.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
