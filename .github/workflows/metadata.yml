# Weekly refresh of every machine-checkable fact in catalog.json: link status
# (`checked`, `link_status`), and stars, licences and archive status from the
# GitHub API. Everything generated from those facts is rebuilt in the same run,
# and the full lint chain has to pass before anything is pushed.
#
# Link stamping used to be nobody's job. links.yml reports dead links but never
# writes, so `checked` froze at the first sweep while the site went on saying
# "link-verified" — a figure whose meaning quietly became "once, in September".
# links.yml stays as the alarm for dead links; this run stamps the live ones.
#
# The bot only ever touches facts a machine can check. Summaries, notes,
# patterns and question_types are human judgements, and retiring a dead row
# needs a human-written reason, so neither happens here.
#
# Delivery: commits straight to main, because every fact here is mechanical and
# the whole lint chain has passed before the commit is made. It used to push a
# branch and wait for a person to merge it each week; the week that did not
# happen, one row went on claiming both an MIT licence and no licence at all.
# Judgement calls still go to people: a dead link is links.yml's alarm, a moved
# call site is claims.yml's issue, and anything here that is not a number moving
# — a licence changing, a project archived, a repository gone — opens an issue
# after it lands. If main moved underneath the run and the refresh no longer
# rebases cleanly, it falls back to a branch and an issue rather than forcing.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the run
# dispatches pages (and lint, for a visible check) itself; workflow_dispatch is
# the documented exception. Without that the site would keep serving last
# week's figures and images.
#
# Permissions note: one of the two places that can push to this repository;
# the other is lint.yml's `regenerate` job, which commits only generated files.
# It needs `contents: write` to push, `issues: write` to file a notice, and
# `actions: write` to dispatch the rebuild.
#
# Injection review: no `github.event.*` value reaches a `run:` block. The issue
# body is read from a file a script wrote, never interpolated into a shell.
name: metadata

on:
  schedule:
    # Wednesdays 06:00 UTC, clear of the link alarm (Mon) and claims (Tue).
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

# Two refreshes racing each other would both try to push the same facts.
concurrency:
  group: metadata
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-stamp links and re-read repository facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp every link that still answers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A dead link exits non-zero; that is links.yml's alarm to raise, and
          # must not stop the live rows from being stamped here. --write only
          # ever stamps rows that answered, so a partial run is still correct.
          python3 scripts/check_links.py --write > /tmp/links.log || true
          tail -5 /tmp/links.log

      - name: Refresh stars, licences and archive status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Not piped: the default shell has no pipefail, and a rate-limited run
          # must fail this step rather than carry on as if it had refreshed.
          python3 scripts/refresh_metadata.py --write --digest /tmp/digest.md > /tmp/refresh.log
          tail -3 /tmp/refresh.log

      - name: Rebuild everything generated from those facts, then lint it all
        run: |
          # The same generators, in the same order, as lint.yml runs, so one
          # added to regenerate.py is never missed here.
          python3 scripts/regenerate.py
          python3 scripts/lint.py
          python3 scripts/build_compat.py --check
          python3 scripts/build_docs.py --check
          python3 scripts/lint_docs.py

      - name: Commit to main, or fall back to a branch if main moved
        id: land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            echo "landed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json README.md README.zh-CN.md docs llms.txt
          git commit -q -m "chore: weekly refresh of link status and repository facts" \
                        -m "$(head -1 /tmp/digest.md)"

          # Someone may have pushed while this ran. Rebase onto them; if the
          # facts no longer apply cleanly, never force — hand it to a person.
          if git pull -q --rebase origin main && git push -q origin HEAD:main; then
            echo "landed=main" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort 2>/dev/null || true
            branch="metadata/refresh-$(date -u +%Y-%m-%d)"
            git push -q -u origin "HEAD:refs/heads/$branch" --force
            echo "landed=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the site from the refreshed data
        if: steps.land.outputs.landed == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run lint.yml --ref main

      - name: File a notice when something needs a person
        if: steps.land.outputs.landed != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANDED: ${{ steps.land.outputs.landed }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          if [ "$LANDED" = "main" ]; then
            # Stars alone are not worth anyone's attention.
            if ! grep -qE "Worth a look|did not resolve" /tmp/digest.md; then
              echo "only star counts moved; landed silently"
              exit 0
            fi
            title="Weekly refresh: changes worth a look"
            lead="Landed on main after the full lint chain passed. These are the changes that were more than a star count:"
          else
            title="Weekly refresh could not land on main"
            lead="main moved during the run and the refresh no longer rebased cleanly, so it is on branch '$LANDED' instead. **[Open the pull request](https://github.com/$repo/compare/main...$LANDED?expand=1)**"
          fi
          {
            echo "$lead"
            echo
            cat /tmp/digest.md
          } > /tmp/body.md

          # A fork has no labels, and a missing label must not fail a job whose
          # real work already landed.
          gh label create metadata --color 1f6feb \
            --description "Automated refresh of repository facts" 2>/dev/null || true
          existing=$(gh issue list --state open --label metadata --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "$title" --label metadata --body-file /tmp/body.md \
              || gh issue create --title "$title" --body-file /tmp/body.md
          fi
