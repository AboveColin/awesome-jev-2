# Weekly discovery: find what the catalogue is missing.
#
# Every other scheduled job keeps existing rows honest. None of them grew the
# catalogue — new projects only entered when someone remembered to run
# discover_candidates.py by hand, while the ecosystem kept adding repositories
# every day. This harvests every sibling directory, reads the code of the
# most-cited repositories not yet catalogued, searches for sibling directories
# not yet harvested, and files what it found as one issue.
#
# It never adds a row. A call site found by a script is a reason for a person to
# read the code; the catalogue's whole claim is that someone did. So the issue is
# a task list: one box per candidate, a `claim owner/name` comment to take one,
# and under each box the command that re-reads that repository
# (`discover_candidates.py --only owner/name`). Candidates proposed in earlier
# weeks and still neither catalogued nor declined are listed by name.
#
# Verdicts persist between runs: a repository found not to call Jev is not
# re-read for 60 days, and a candidate already proposed is listed among the
# earlier ones rather than as new. They live in git, in .discover/seen.json
# (scripts/discover_seen.py), as the Actions cache alone can lose them: GitHub
# evicts a cache after seven days without access, which is this schedule, and
# scheduled runs start hours late. This workflow reads strangers' repositories,
# so it holds no write permission: it leaves the verdicts as an artifact, and
# metadata.yml, which already commits the weekly facts, commits them. The cache
# stays as the fast path: it restores the newest run's verdicts, which the
# committed file may not have yet, and the script keeps the newer of the two.
#
# Injection review: no `github.event.*` value reaches a `run:` block. The issue
# body is read from a file the script wrote. Repository descriptions from the
# search API and file paths from a candidate's tree land in that body as
# Markdown text (neutralised by inert() and code_span()), never in a shell.
name: discover

on:
  schedule:
    # Thursdays 06:00 UTC, after links (Mon), claims (Tue) and the refresh (Wed).
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    name: Harvest sibling lists and read the most-cited candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Restores the newest verdict cache; a unique key per run means the
      # updated cache is saved as a new entry at the end of the job. A cache
      # from before the verdicts moved into git (a bare mapping) still reads.
      - uses: actions/cache@v6
        with:
          path: .cache/discover-seen.json
          key: discover-seen-${{ github.run_id }}
          restore-keys: discover-seen-

      - name: Discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/discover_candidates.py --top 150 --find-lists \
            --seen .discover/seen.json --seen .cache/discover-seen.json \
            --markdown /tmp/body.md > /tmp/discover.log
          tail -20 /tmp/discover.log

      # metadata.yml takes the newest of these from a successful run on main
      # and commits it. Kept for the longest GitHub allows, so a few missed
      # weekly refreshes lose nothing. The path is in a dot-directory, which
      # upload-artifact leaves out unless told otherwise.
      - name: Leave the verdicts for the weekly refresh to commit
        uses: actions/upload-artifact@v7
        with:
          name: discover-seen
          path: .discover/seen.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Open or update the discovery issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -qE '^### ' /tmp/body.md; then
            echo "no new candidates and no new sibling directories this week"
            exit 0
          fi

          gh label create discovery --color 8250df \
            --description "Candidates the weekly discovery run found" 2>/dev/null || true

          # `help wanted` is one of GitHub's default labels: reading a call site
          # and writing two lines is work anyone can pick up. A repository
          # without it (a fork) still gets the `discovery` label, which is how
          # next week's run finds this issue again.
          existing=$(gh issue list --state open --label discovery --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "Discovery: candidates to read" \
              --label discovery --label "help wanted" --body-file /tmp/body.md \
              || gh issue create --title "Discovery: candidates to read" \
                   --label discovery --body-file /tmp/body.md \
              || gh issue create --title "Discovery: candidates to read" \
                   --body-file /tmp/body.md
          fi
